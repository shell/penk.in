  text: |
    I had the pleasure of managing Vlad for nearly four years at Rev, and throughout that time, what consistently impressed me was his strong sense of ownership, accountability, and conviction. Vlad was never afraid to speak his mind or challenge ideas, but he always did so with the shared goal of making the product, team, and company better. He cared deeply about doing things the right way and consistently backed his words with action.

    As an engineer, Vlad was a strong backend developer with a particular passion for architecture, infrastructure, and solving complex technical challenges. But what made him truly special was the kind of teammate he was. He was always willing to lend a hand, make himself available, and support those around him. Quiet yet confident, kind yet direct, Vlad earned the trust and respect of everyone he worked with.

    Beyond work, I was fortunate to build a genuine personal connection with Vlad. We shared stories about our lives, including our immigration journeys, and I came to know him as someone with tremendous character and integrity.

    Vlad is a thoughtful, sharp, strong-willed engineer who genuinely cares about his team and the work he does. He's someone I'd love to work with again, and any engineering team would be fortunate to have him.
