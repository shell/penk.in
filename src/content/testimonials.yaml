- name: Gage Domhoff
  url: https://www.linkedin.com/in/gagedomhoff/
  avatar: gage-domhoff
  headline: Quality Assurance Engineer
  relationship: Worked with Vladimir on the same team
  date: 2026-10-10
  text: |
    I had the pleasure of working with Vladimir for over five years. I was a QA engineer and he was a developer on our team, building complex legal SaaS products. One of the biggest projects we shipped together was an end-to-end legal marketplace for RTC deliverables. It combined AI-driven processing with human reviewers, so it had a lot of moving parts and very little room for error.

    Vlad is a very talented developer. He handled hard technical problems with skill and care, and his work was consistently solid. What stood out most to me as a QA engineer was how well he took feedback. He never treated a bug report as criticism. He saw it as a shared goal, dug into the problem, and turned fixes around quickly and thoroughly. That attitude made the whole team better and made our releases more reliable.

    He’s also simply a great person to work with. He’s positive, easy to talk to, and collaborative even under deadline pressure. Any team would be lucky to have Vlad, and I’d gladly work with him again.
