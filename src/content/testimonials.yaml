  text: |
    I had the pleasure of working with Vlad for many years at Rev, both as his manager and his teammate. He was one of the first hires we made when building out my team at the time. The successes that Rev had while he was there are in no small part because Vlad was on the team.

    Vlad was always a trusted engineer on the teams that he was a part of. We could give him any problem and trust that the solution would be of high quality. Vlad repeatedly showed that he was capable and comfortable across our tech stack.

    One thing that has always impressed me about Vlad is his dedication to the team. In his first years at Rev, he was willing to work off hours to accommodate the time difference he had at the time, to ensure that he had sufficient overlap with the rest of the team. He was also a generous teammate that was always willing to give some of his time to help his teammates out. Those are just a couple examples of how Vlad invests in his team’s success.

    Vlad was a key member of my team at Rev, and I’m sure the same would be true of any team he joins.
